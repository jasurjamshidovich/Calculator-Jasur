<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalculatoJasur</title>

    <script src="idk.js" defer></script>
    <link rel="stylesheet" href="idk.css" />

    <meta
      name="google-site-verification"
      content="Rh4WF8onuNFDa87D2hhEVBoHn2dLrxV59Jz6rvOUGms"
    />
  </head>

  <body>
    <div class="component">
      <section class="screen">0</section>

      <section class="button-sections">
        <div class="button-row">
          <button class="cal-button double">C</button>
          <button class="cal-button">&lt;-</button>
          <button class="cal-button">/</button>
        </div>

        <div class="button-row">
          <button class="cal-button">7</button>
          <button class="cal-button">8</button>
          <button class="cal-button">9</button>
          <button class="cal-button">*</button>
        </div>

        <div class="button-row">
          <button class="cal-button">4</button>
          <button class="cal-button">5</button>
          <button class="cal-button">6</button>
          <button class="cal-button">-</button>
        </div>

        <div class="button-row">
          <button class="cal-button">1</button>
          <button class="cal-button">2</button>
          <button class="cal-button">3</button>
          <button class="cal-button">+</button>
        </div>

        <div class="button-row">
          <button class="cal-button triple">0</button>
          <button class="cal-button">=</button>
        </div>
      </section>
    </div>
  </body>
</html>
